name: CI

on:
  push:
    branches:
      - main
      - 'milestone/**'
  pull_request:
    # Trigger for all PR bases (including milestone/* stacked PRs), not only main.
    branches:
      - main
      - 'milestone/**'

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ubuntu-latest ships an Android SDK. Avoid android-actions/setup-android's
      # default packages list, which still requests the obsolete `tools` package
      # (sdkmanager: "Failed to find package 'tools'").
      - name: Accept Android SDK licenses
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          echo "ANDROID_HOME=${SDK}"
          test -n "${SDK}"
          mkdir -p "${SDK}/licenses"
          # Standard Google Android SDK license accept hashes used by CI.
          echo -e "24333f8a63b6825ea9c5514f6c8526de\n" > "${SDK}/licenses/android-sdk-license"
          echo -e "84831b9409646f7d9bce2afc0a0d2e8d\n" > "${SDK}/licenses/android-sdk-preview-license"
          echo -e "d56f5187479451bea6f3ce0b1ce4abd6\n" > "${SDK}/licenses/android-googletv-license"
          echo -e "33b6a2b64607f11b759f320ef9dff4ae\n" > "${SDK}/licenses/google-gdk-license"
          echo -e "e9acab5b5fbb460a04543883d0ab7129\n" > "${SDK}/licenses/mips-android-sysimage-license"

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          CMDLINE_TOOLS=""
          for candidate in \
            "${SDK}/cmdline-tools/latest/bin/sdkmanager" \
            "${SDK}/cmdline-tools/16.0/bin/sdkmanager" \
            "${SDK}/cmdline-tools/12.0/bin/sdkmanager" \
            "${SDK}/tools/bin/sdkmanager"; do
            if [ -x "${candidate}" ]; then
              CMDLINE_TOOLS="${candidate}"
              break
            fi
          done
          if [ -z "${CMDLINE_TOOLS}" ]; then
            echo "sdkmanager not found under ${SDK}"
            ls -la "${SDK}/cmdline-tools" || true
            exit 1
          fi
          echo "Using sdkmanager: ${CMDLINE_TOOLS}"
          # Package names as args (do not request obsolete "tools").
          yes | "${CMDLINE_TOOLS}" --licenses >/dev/null || true
          "${CMDLINE_TOOLS}" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Grant execute on gradlew
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: weave-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weave-lint-results
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
